#
# Configuración de las animaciones de apertura de baúl.
# DisplayName acepta MiniMessage: <color>, <gradient:..>, <#hex>, <rainbow>, <bold>.
#
# Si quieres resetear una opción a su valor por defecto, borra la línea
# y reiniciá el plugin. Para resetear toda la animación, borrá todo el bloque.
#

default_animation: animation2

animations:

  animation_0:
    Enabled: true
    DisplayName: '<gray>Sin animación</gray>'
    OutlineParticles: true
    FloorParticles: true
    NeedPermission: false
    Icon:
      material: BARRIER

  animation_1:
    Enabled: true
    DisplayName: '<gradient:#ffaa00:#ff5555>Estrella Festiva</gradient>'
    AroundParticles: true
    NeedPermission: true
    Icon:
      material: FIREWORK_STAR

