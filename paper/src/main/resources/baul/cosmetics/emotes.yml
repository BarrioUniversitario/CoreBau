# =====================================================================
# EMOTES
# Se activan a demanda con /baul cosmetic use <id> o click en el menú.
# =====================================================================
#
# Los emotes NO se equipan. Se POSEEN y se disparan cuando el jugador quiera.
# Cada emote tiene su propio cooldown para evitar spam.
# Los cooldowns se sincronizan entre lobbies vía la tabla ac_emote_cooldowns.
#
# CAMPOS:
#   display, rarity, icon, permission, price — igual que otros cosméticos
#   particle, particleData, amount, spread, sound, pitch — igual que join effects
#   cooldown           Milisegundos antes de poder usar el mismo emote otra vez

