# =====================================================================
# MASCOTAS (PETS) — subsistema embebido (rescatado de BetterPets)
# =====================================================================
#
# El renderizado usa el subsistema de pets que vive dentro del JAR de Baul
# en el paquete me.davidml16.baul.pets. No requiere instalar BetterPets como
# plugin separado, ni Goldman Pets, ni nada externo.
#
# Cada entrada DEBE declarar el campo `betterPets: <baseId>_<rareza>` apuntando
# a una plantilla registrada en me.davidml16.baul.pets.registry.PetManager.
#
# Campos por entrada:
#   display     — nombre visible (MiniMessage)
#   rarity      — categoría cosmética (COMMON, UNCOMMON, RARE, EPIC, LEGENDARY, MYTHIC)
#   icon        — material del ítem en el menú
#   permission  — vacío = sin permiso requerido
#   price       — coste en puntos
#   betterPets  — id de plantilla: <baseId>_<rareza>
#
# Rarezas disponibles por especie (referencia):
#   ender_dragon     EPIC, LEGENDARY
#   enderman         COMMON..MYTHIC
#   endermite        COMMON..MYTHIC
#   ghoul            EPIC, LEGENDARY
#   golem            EPIC, LEGENDARY
#   grandma_wolf     LEGENDARY
#   horse            COMMON..LEGENDARY
#   hound            EPIC, LEGENDARY
#   lion             RARE, EPIC, LEGENDARY
#   phoenix          EPIC, LEGENDARY
#   pigman           EPIC, LEGENDARY
#   rock             COMMON..LEGENDARY
#   skeleton_horse   EPIC, LEGENDARY
#   skeleton         COMMON..LEGENDARY
#   spider           COMMON..LEGENDARY
#   tarantula        EPIC, LEGENDARY
#   tiger            RARE, EPIC, LEGENDARY
#   wolf             COMMON..LEGENDARY
#   zombie           COMMON..LEGENDARY
#   bee              COMMON..LEGENDARY
#   chicken          COMMON..LEGENDARY
#   elephant         RARE, EPIC, LEGENDARY
#   pig              COMMON..LEGENDARY
#   rabbit           COMMON..LEGENDARY
#   blue_whale       EPIC, LEGENDARY
#   dolphin          COMMON..LEGENDARY
#   flying_fish      RARE, EPIC
#   squid            COMMON..LEGENDARY
#   silverfish       COMMON..LEGENDARY
#   wither_skeleton  EPIC, LEGENDARY
#   giraffe          UNCOMMON..LEGENDARY
#   monkey           COMMON..LEGENDARY
#   ocelot           COMMON..LEGENDARY
#   parrot           EPIC, LEGENDARY
#   sheep            COMMON..LEGENDARY
#   guardian         RARE, EPIC, LEGENDARY

