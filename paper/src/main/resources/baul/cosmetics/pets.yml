# =====================================================================
# MASCOTAS (PETS)
# Entidades pasivas que siguen al jugador por el lobby.
# =====================================================================
#
# La mascota se spawnea sin AI vanilla (todas las goals se eliminan vía
# Bukkit.getMobGoals().removeAllGoals). Sólo se mueve cuando el plugin le da
# un destino con pathfinder.moveTo cada 0.25s. Si te movés rápido (volar /
# elytra / vehículo / velocidad alta), la mascota se teletransporta a tu lado.
# Si estás idle, la mascota se queda quieta sin vagar.
#
# La mascota es invulnerable, silenciosa, no colisiona contigo, y no se guarda
# en el mundo (no se persiste). Al reiniciar el server, vuelve a spawnearse
# automáticamente en el siguiente login si la tenías equipada.
#
# CAMPOS:
#   display, rarity, icon, permission, price — igual que otros cosméticos
#   entity     EntityType de Bukkit. Sólo entidades pequeñas y pacíficas:
#              CHICKEN, BEE, ALLAY, PARROT, AXOLOTL, CAT, RABBIT, FROG.
#              Mobs hostiles o PLAYER fallarán al spawnear.
#   name       Nombre mostrado encima (acepta MiniMessage). Usá %player% para el
#              nombre del dueño. Vacío = sin nombre visible.

