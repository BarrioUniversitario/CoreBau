# =====================================================================
# ALAS (WINGS) — formas paramétricas renderizadas detrás del jugador
# =====================================================================
#
# Cada Wing dibuja una forma parametrizada con partículas DUST (coloreables)
# detrás/sobre el jugador. La emisión usa World.spawnParticle(..., force=true)
# para que sea visible a todos los espectadores en rango (~256 bloques).
#
# Campos por entrada:
#   display          — nombre visible (MiniMessage)
#   rarity           — categoría visual (COMMON..MYTHIC)
#   icon             — material del ítem en el menú
#   permission       — vacío = sin permiso requerido
#   price            — coste en puntos
#   shape            — BUTTERFLY | HEART | INFINITY | STAR | RING | HALO |
#                      ANGEL | BAT | DRAGONFLY
#   color            — color primario en HEX (#RRGGBB) o nombre
#   secondaryColor   — color secundario (solo si gradient=true)
#   gradient         — true → mezcla color↔secondaryColor por fase y tick
#   dustSize         — tamaño del punto DUST (0.6 típico, 0.4–1.2)
#   scale            — tamaño general de la forma (0.35 mariposa, 0.8 grande)
#   density          — grados entre cada punto emitido (2 denso, 6 esparcido)
#   interval         — cada cuántos ticks redibujar (2 = 10 FPS, 4 = 5 FPS)

