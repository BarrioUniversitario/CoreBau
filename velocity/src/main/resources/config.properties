# Logs detallados de plugin messages (PlayerCountAll, etc.)
# Activar solo para depuración: genera mucho spam si Board/Selector están activos
debug=false

# Lista de servidores lobby separada por comas
# El comando /lobby conecta al que tenga menos jugadores (load balancing)
lobbies=lobby1,lobby2

# Mensaje al ejecutar /lobby
lobby-message=<gold>Conectando al lobby...</gold>

# Mensaje si no hay lobbies disponibles
lobby-no-servers=<red>No hay lobbies disponibles.</red>

# Redirigir automáticamente a otro lobby al ser expulsado (kick)
lobby-fallback-on-kick=true

# Reenviar mensajes baul:sync entre servidores (sync de Baul entre lobbies)
# Instalar Baul en los servidores backend con Sync.Enabled: true
baul-sync-enabled=false

# Reenviar mensajes npc:sync entre servidores (sync del plugin Npc cuando
# usa el backend MySQL). Cada lobby que reciba el mensaje recarga sus NPCs
# desde la DB. Dejar en true salvo que no uses MySQL en Npc.
npc-sync-enabled=true
